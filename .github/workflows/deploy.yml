name: Deploy Yougoo Website to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Deploy VPS
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Récupération du code
        uses: actions/checkout@v4

      - name: 📦 Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Installation des dépendances (sur le runner GitHub)
        run: npm ci || npm install

      - name: 🏗️ Compilation du site en statique (Vite build)
        run: npm run build

      - name: 📂 Déploiement des fichiers compilés dans /var/www/yougoo-website (aucun code source)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/"
          target: "/var/www/yougoo-website/"
          strip_components: 1

      - name: 🔒 Permissions www-data & rechargement Apache
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            chown -R www-data:www-data /var/www/yougoo-website
            chmod -R 755 /var/www/yougoo-website
            systemctl reload apache2
